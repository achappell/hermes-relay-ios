name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion build string (for example, 1 or 0.3.2); increment the latest TestFlight build"
        required: true
        type: string
      release_notes:
        description: "Optional notes for the TestFlight build"
        required: false
        type: string
      wait_for_processing:
        description: "Wait for App Store Connect processing to finish"
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      build_number:
        description: "CFBundleVersion build string (for example, 1 or 0.3.2); increment the latest TestFlight build"
        required: true
        type: string
      release_notes:
        description: "Optional notes for the TestFlight build"
        required: false
        default: ""
        type: string
      wait_for_processing:
        description: "Wait for App Store Connect processing to finish"
        required: false
        default: true
        type: boolean
      release_ref:
        description: "Release tag or ref to archive"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.repository }}
  cancel-in-progress: false

env:
  PROJECT: Hermes Relay.xcodeproj
  SCHEME: HermesRelay
  BUNDLE_ID: com.achappell.HermesRelay

jobs:
  upload:
    name: Archive and upload iOS build
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false

      - name: Show Xcode toolchain
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version

      - name: Validate release metadata
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || {
            echo "build_number must contain one to three non-negative integers separated by periods (for example, 1 or 0.3.2)."
            exit 1
          }

          settings="$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -showBuildSettings)"
          project_version="$(sed -n 's/^    MARKETING_VERSION = //p' <<<"$settings" | head -1)"
          team_id="$(sed -n 's/^    DEVELOPMENT_TEAM = //p' <<<"$settings" | head -1)"
          test -n "$project_version" || {
            echo "MARKETING_VERSION could not be read from the Xcode project."
            exit 1
          }

          if [[ -n "$RELEASE_REF" ]]; then
            release_version="${RELEASE_REF##*/}"
            release_version="${release_version#v}"
            [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || {
              echo "release_ref must identify a semantic-versioned release tag."
              exit 1
            }
            test "$release_version" = "$(tr -d '[:space:]' < version.txt)" || {
              echo "release_ref does not match version.txt."
              exit 1
            }
            project_version="$release_version"
          fi

          test -n "$team_id" || {
            echo "DEVELOPMENT_TEAM could not be read from the Xcode project."
            exit 1
          }
          echo "MARKETING_VERSION=$project_version" >> "$GITHUB_ENV"
          echo "TEAM_ID=$team_id" >> "$GITHUB_ENV"
          echo "Validated version $project_version with build $BUILD_NUMBER."

      - name: Import Apple distribution certificate
        uses: apple-actions/import-codesign-certs@b2e261033a9e248f91a9b57201e8d1e12b15a24e # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        id: profiles
        uses: apple-actions/download-provisioning-profiles@473562c853e9f580367eeff7c180258653e416e0 # v6.1.0
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Verify downloaded provisioning profile
        env:
          PROFILES_JSON: ${{ steps.profiles.outputs.profiles }}
        run: |
          set -euo pipefail
          profile_count="$(jq 'length' <<<"$PROFILES_JSON")"
          test "$profile_count" -gt 0 || {
            echo "No App Store provisioning profile was downloaded for $BUNDLE_ID."
            exit 1
          }
          echo "Found $profile_count App Store provisioning profile(s) for $BUNDLE_ID."

      - name: Prepare App Store Connect authentication key
        env:
          ASC_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_KEY_ID" || {
            echo "APPSTORE_API_KEY_ID is not configured."
            exit 1
          }
          test -n "$ASC_ISSUER_ID" || {
            echo "APPSTORE_ISSUER_ID is not configured."
            exit 1
          }
          test -n "$ASC_API_PRIVATE_KEY" || {
            echo "APPSTORE_API_PRIVATE_KEY is not configured."
            exit 1
          }
          key_path="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_ID=$ASC_API_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HermesRelay.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/hermes-relay-ios-archive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export App Store package
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HermesRelay.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa_path="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path" || {
            echo "The archive export did not produce an IPA."
            exit 1
          }
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload build to TestFlight
        uses: apple-actions/upload-testflight-build@6fd267a887d75a215682c05c861278a67801855c # v5.3.0
        with:
          app-path: ${{ env.IPA_PATH }}
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: false
          wait-for-processing: ${{ inputs.wait_for_processing }}
          backend: appstore-api

      - name: Upload IPA and dSYM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testflight-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/HermesRelay.xcarchive/dSYMs/*.dSYM
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove App Store Connect authentication key
        if: always()
        run: |
          if [[ -n "${ASC_API_KEY_PATH:-}" ]]; then
            rm -f "$ASC_API_KEY_PATH"
          fi
